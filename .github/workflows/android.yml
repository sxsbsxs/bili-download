name: Android build

on:
  push:
    branches: [main, feat/real-bilibili-download]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test native MP4 inspector
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iapp/src/main/cpp app/src/main/cpp/mp4_inspector.cpp app/src/test/cpp/mp4_inspector_test.cpp -o /tmp/mp4_inspector_test
          /tmp/mp4_inspector_test
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify packaged native library
        run: test -f app/build/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib/arm64-v8a/libbilidl_core.so
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run Room SQLite integration tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests "com.example.bilidl.data.local.BiliDownloadDatabaseTest"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bili-download-debug
          path: app/build/outputs/apk/debug/app-debug.apk
