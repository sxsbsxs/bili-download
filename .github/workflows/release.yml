name: Manual Android test release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test release version, for example v1.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test-build:
    if: github.ref == 'refs/heads/main' && startsWith(inputs.version, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.3.0" >&2
            exit 1
          fi
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build debug-signed test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare release asset
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/BiliDl-$RELEASE_VERSION-debug.apk"
      - name: Publish draft test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: "BiliDl ${{ inputs.version }} (test build)"
          draft: true
          prerelease: true
          files: release/*.apk
          body: |
            Automated debug-signed test build. This is not a Play Store production release.
            Review the build and test it on-device before distributing it.
