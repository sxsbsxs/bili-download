name: Tagged Android test build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build debug-signed test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare release asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/BiliDl-$GITHUB_REF_NAME-debug.apk"
      - name: Publish draft test release
        uses: softprops/action-gh-release@v2
        with:
          name: "BiliDl \${{ github.ref_name }} (test build)"
          draft: true
          prerelease: true
          files: release/*.apk
          body: |
            Automated debug-signed test build. This is not a Play Store production release.
            Review the build and test it on-device before distributing it.
