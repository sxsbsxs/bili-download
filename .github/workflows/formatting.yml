name: Source checks

on:
  push:
    branches: [main, feature/anonymous-playurl-storage-http-tests, feature/multisegment-durl-flv-merge]
  pull_request:
    branches: [main, refactor/nonblocking-download-progress]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        run: git show --check --oneline --format= HEAD
      - name: Check project layout and dependencies
        run: bash scripts/check-project.sh
